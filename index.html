    x.ch.map(function(c){return '<span class="c">'+esc(c)+'</span>'}).join('')+(x.s===3?'<span class="h">พักไว้ก่อน</span>':'')+(S.who==='*'?'<span>'+esc(x.own.join(' · '))+'</span>':'')+'</div></div><div class="ar" onclick="tog('+x.i+')">›</div></div>'+
    '<div class="why"><b>ทำไมต้องทำ</b>'+esc(x.pb)+'</div></div>'}).join('')}
